version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskapi
      POSTGRES_USER: taskapi_user
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - taskapi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskapi_user -d taskapi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  taskapi_pgdata:
