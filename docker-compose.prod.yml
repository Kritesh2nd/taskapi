services:
  taskapi:
    image: ${IMAGE_TAG}

    container_name: taskapi

    restart: unless-stopped

    ports:
      - "8081:8080"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

    networks:
      - taskapi-network

networks:
  taskapi-network:
    driver: bridge
